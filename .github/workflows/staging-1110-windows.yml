name: "staging 1110 windows"

on:
  push:
    branches:
      - pr-1110-fix-xplat
  pull_request:
  workflow_dispatch:

concurrency:
  group: staging-1110-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: "windows-latest"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_ALLOW_CPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4.0,<2.11.0"
          pip install -e .[core]
          pip install pytest==9.0.3
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main"
      - name: Preference suite
        run: python -m pytest tests/test_mlx_preference.py -q
      - name: Import integrity (no mlx must be imported)
        run: |
          python -c "import sys, unsloth_zoo; leaked=[n for n in sys.modules if n=='mlx' or n.startswith('mlx.')]; assert not leaked, leaked; print('import integrity OK')"
