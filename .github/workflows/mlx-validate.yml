name: mlx-pr786
on:
  push:
    branches: ["mlx-pr786-validate"]
  workflow_dispatch:
concurrency:
  group: mlx-pr786-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mlx:
    name: MLX PR 786 VLM resume-from-checkpoint (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install zoo with MLX extras
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install "pytest==9.0.3"
      - name: Import smoke
        continue-on-error: true
        run: |
          python -c "import unsloth_zoo.mlx.trainer; print('trainer OK')"
      - name: New VLM resume test (the metal-only addition)
        run: python -m pytest "tests/test_mlx_pr684_full_validation_metal.py::test_vlm_resume_from_checkpoint_matches_fresh_run" -v -rs
      - name: Full pr684 validation file (resume + e2e regressions)
        run: python -m pytest tests/test_mlx_pr684_full_validation_metal.py -v -rs
