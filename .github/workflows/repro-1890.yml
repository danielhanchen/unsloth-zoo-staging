name: repro-1890
on:
  push:
    branches: [repro-1890]
jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: "1"
      UNSLOTH_IS_PRESENT: "1"
      UNSLOTH_ZOO_DISABLE_GPU_INIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arms
        run: |
          git clone -q https://github.com/unslothai/unsloth-zoo zoo
          git -C zoo fetch -q origin pull/1890/head:pr
          git -C zoo worktree add -q "$PWD/base" 83191f4d1cb774e5708bd72df05b416b8889bbcd
          git -C zoo worktree add -q "$PWD/head" pr
          git -C head log -1 --format='head %H'; git -C base log -1 --format='base %H'
          cp head/tests/test_mlx_decode_metal.py head/tests/test_mlx_attention_metal.py base/tests/
      - name: install
        run: |
          python -m pip install -q -e ./head pytest pytest-timeout
          python -m pip install -q --no-deps git+https://github.com/unslothai/unsloth
          python -m pip list 2>/dev/null | grep -i -E "^(mlx|transformers|unsloth)"
      - name: tests base vs head
        run: |
          for arm in base head; do
            echo "=== ARM $arm"
            (cd $arm && PYTHONPATH="$PWD" python -m pytest tests/test_mlx_decode_metal.py tests/test_mlx_attention_metal.py -q -rA -k "qsa" -p no:cacheprovider 2>&1 | grep -E "^(PASSED|FAILED|SKIPPED|ERROR)|passed|failed|error") || true
          done
      - name: shader-validated repro base vs head
        run: |
          for arm in base head; do
            echo "=== ARM $arm"
            (cd $arm && PYTHONPATH="$PWD" MTL_SHADER_VALIDATION=1 MTL_DEBUG_LAYER=1 python ../scripts/e2e.py 2>&1 | grep -v -E "^\s*$" | tail -40) || true
          done
