name: "mlx-mac-real"
on:
  push:
    branches: ['mlx-mac-pr*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  mlx-real:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real MLX + unsloth_zoo + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlx mlx-lm
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-timeout torch
      - name: Confirm real MLX / Metal
        run: |
          python -c "import mlx.core as mx; print('metal_available:', mx.metal.is_available())"
          python -c "import importlib.metadata as m; print('mlx', m.version('mlx')); print('mlx-lm', m.version('mlx-lm'))"
      - name: Real-MLX API validation (per-feature)
        run: python .github/scripts/mlx_real_validate.py
      - name: Real-MLX Metal e2e training tests (where present)
        run: python -m pytest -q -rs tests/test_mlx_training_e2e_metal.py || true
      - name: Full unit suite (torch shim + any metal)
        run: python -m pytest -q tests -rs || true
