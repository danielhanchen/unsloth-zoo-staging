# Staging-only experiment, not for the upstream repo.
#
# The audio probe's two losses were not reproducible on Metal: mlx-vlm 0.6.3
# returned the same loss for the first clip across two runs (30.5491) and a
# different one for the second (26.5851, then 27.8627). A first call that
# repeats and a second call that does not is the signature of state carried
# between forwards, and Gemma 4 E2B reuses K/V across its last 20 layers.
#
# Linux CPU MLX is clean: four identical inputs, spread 0.000000000. So the
# question is Metal-specific, and this asks it on Metal.

name: Gemma4 repeat-forward check (Apple Silicon)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repeat:
    name: "repeat forward @ mlx-vlm 0.6.3"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'gemma4-repeat'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install zoo with mlx-vlm 0.6.3
        # 0.6.3 because that is the version whose second loss moved between
        # runs. One resolution, so the transformers cap is honoured.
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx] "mlx-vlm==0.6.3"
          python -c "import mlx_vlm; print('mlx-vlm', mlx_vlm.__version__)"

      - name: Cache the checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gemma4-e2b-4bit-v1

      - name: Repeat the same forward
        run: |
          python tests/gemma4_repeat_forward_check.py \
            --model mlx-community/gemma-4-e2b-it-4bit
