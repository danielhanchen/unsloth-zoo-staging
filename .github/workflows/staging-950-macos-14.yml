name: "staging-950 macos-14"
on:
  push:
    branches: ["pr-950-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-950-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: python -m pip install torch transformers peft huggingface_hub unsloth
      - run: rc=0; python -m pytest tests/test_check_hf_model_exists_transport_errors.py tests/test_gated_and_offline_config_classification.py tests/test_hub_transport_errors_single_segment.py tests/test_local_4bit_merge_offline_resolution.py tests/test_local_base_model_resolution_offline.py tests/test_local_fp8_base_offline_resolution.py tests/test_merge_e2e_hub_unreachable.py tests/test_quant_status_transport_errors.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
