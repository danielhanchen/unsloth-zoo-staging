# Throwaway staging-fork CI for PR #684 (explore/mlx, MLX Update Training)
# synced with main. macos-14 is the only platform where MLX wheels resolve,
# so this is the only workflow exercising real Metal kernels, the reworked
# MLXTrainer loop, and a real LoRA training run end to end.
#
# Push-only trigger on this staging branch plus manual dispatch; iterating
# with new pushes auto-cancels stale runs.

name: MLX PR 684 validation (macOS Apple Silicon)

on:
  push:
    branches: [staging/mlx-pr-684]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mlx-pr-684-mac:
    name: PR 684 validation on Apple Silicon
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Confirm runner is real Apple Silicon
        run: |
          python -c "
          import platform
          assert platform.system() == 'Darwin', platform.system()
          assert platform.machine() == 'arm64', platform.machine()
          print('OK: macOS arm64 confirmed')
          "

      - name: Install unsloth_zoo with MLX extras (+ torch for shim tests)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          pip install -e .[mlx]
          pip install pytest==9.0.3 safetensors

      - name: Smoke-import MLX submodules
        run: |
          python -c "
          import importlib
          for name in [
              'unsloth_zoo.mlx.loader',
              'unsloth_zoo.mlx.trainer',
              'unsloth_zoo.mlx.utils',
              'unsloth_zoo.mlx.compile',
              'unsloth_zoo.mlx.runtime',
              'unsloth_zoo.mlx.cce',
          ]:
              importlib.import_module(name)
              print('OK:', name)
          import mlx.core as mx
          print('OK: mlx.core')
          "

      - name: Qwen3.5 VJP regressions (issue 6002 guards, must pass)
        run: python -m pytest tests/test_qwen35_vjp_metal.py -v -rs

      - name: Real LoRA training e2e (must pass)
        run: python -m pytest tests/test_mlx_training_e2e_metal.py -v -rs

      - name: Regression breadth, full MLX suite on real Metal
        continue-on-error: true
        run: python -m pytest tests/test_mlx_*.py -v -rs --deselect tests/test_mlx_training_e2e_metal.py
