name: "staging-1213 macos-15-intel"
on:
  push:
    branches: ["pr-1213-basecheck"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      # unsloth_zoo/__init__ has two separate gates: UNSLOTH_IS_PRESENT clears the late
      # one, but the early find_spec("unsloth") check is only skipped by this. Without it
      # every test importing unsloth_zoo dies at collection on a runner without unsloth.
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: rc=0; python -m pytest tests/test_vllm_to_hf_conversion.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then errs=$(awk '/^ERROR /{n++} END{print n+0}' pytest_out.txt); deps=$(awk '/No module named .(torch|unsloth_zoo|transformers)./{n++} END{print n+0}' pytest_out.txt); if [ "$deps" -gt 0 ] && [ "$deps" -ge "$errs" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
