name: "staging-1011 macos-14"
on:
  push:
    branches: ["pr-1011-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: MLX preference on real Apple Silicon
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same install the repo's own mlx-ci.yml uses: pyproject gates torch OFF on
      # darwin+arm64, but tests/mlx_simulation unconditionally imports it.
      - name: Install zoo with MLX extras
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install pytest==9.0.3 timm
      - name: Confirm this is the real MLX runtime with Metal
        run: |
          python -c "
          import mlx.core as mx
          assert 'mlx_simulation' not in mx.__file__, mx.__file__
          print('mlx', mx.__version__, 'file', mx.__file__)
          print('metal available:', mx.metal.is_available())
          assert mx.array([1,2,3]).sum().item() == 6
          "
      - name: Preference suites (torch shim)
        run: python -m pytest tests/test_mlx_preference.py tests/test_mlx_trainer_internals.py -q -rs
      # The point of this lane: these are @metal_only and skip on every Linux
      # runner, so the eval-mode / NEFTune gating in this PR has never executed.
      - name: Metal e2e (preference + neftune)
        run: python -m pytest tests/test_mlx_training_e2e_metal.py -q -rs -k "preference or neftune or failed_evaluation"
      - name: RNG rewind on the Metal wheel
        run: python -m pytest tests/test_mlx_rng_rewind.py -q -rs
