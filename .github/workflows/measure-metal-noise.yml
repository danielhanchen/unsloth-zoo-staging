# Staging-only measurement, not for the upstream repo.
#
# The noise floor added to stage 4 gates on a margin of 4x the spread of three
# repeats. That number has never been evaluated against the platform it was
# written for. The only measured two-tone signal is 0.3271 nats on Linux, so
# the gate flips to below_noise once the Metal spread exceeds 0.0818 nats.
#
# The new code already prints `noise=`. This runs one cell to read it.

name: Measure the Metal noise floor

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: "stage 4 noise on Apple Silicon"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'measure-noise'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx] "mlx-vlm==0.6.3"

      - name: Run stage 4 and print the floor
        # Three runs of the whole probe, because the floor is itself a
        # measurement and one sample of it decides nothing. `|| true` so a
        # below_noise verdict still prints rather than ending the job: a red
        # cell here is a result, not a failure.
        run: |
          for i in 1 2 3; do
            echo "===== probe run $i ====="
            python tests/gemma4_audio_version_probe.py 2>&1 |
              grep -E '^\[(PASS|FAIL)\] 4_|^=== gemma4' || true
          done
