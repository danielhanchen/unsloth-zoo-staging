          if not os.path.exists("report.xml"):
              sys.exit("VERIFICATION FAILED for " + FILE + ": pytest wrote no junit report "
                       "(collection error or interpreter crash)")
          root = ET.parse("report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          passed = tests - skipped - failures - errors
          print(f"VERDICT file={FILE!r} total={tests} passed={passed} "
                f"skipped={skipped} failures={failures} errors={errors}")
          problems = []
          if tests == 0:
              problems.append("collected 0 tests")
          if skipped:
              problems.append(f"{skipped} SKIPPED (must run for real on Apple Silicon)")
          if failures or errors:
              problems.append(f"{failures} failed / {errors} errored")
          if problems:
              sys.exit("VERIFICATION FAILED for " + FILE + ": " + "; ".join(problems))
          print("VERIFICATION OK for " + FILE)
          PY

      - name: "Remaining tests/test_mlx*.py sweep (known red on upstream main, excluded from the pass/fail verdict)"
        if: always()
        continue-on-error: true
        run: |
          strict="tests/test_mlx_switch_lora.py tests/test_mlx_finetune_last_n_layers.py tests/test_mlx_get_peft_model_seed_ordering.py tests/test_mlx_trainer_internals.py"
          rc=0
          for f in tests/test_mlx*.py; do
            case " $strict " in *" $f "*) echo "SWEEP-SKIP $f (covered by a strict step)"; continue ;; esac
            echo "::group::$f"
            python -m pytest "$f" -q -rs \
              --deselect tests/test_mlx_batching_and_decay.py::test_compiler_review_guards_are_present \
              || { echo "SWEEP-RED $f"; rc=1; }
            echo "::endgroup::"
          done
          echo "SWEEP-EXIT $rc (informational only; the strict steps above are the verdict)"
