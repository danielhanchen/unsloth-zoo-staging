# Scratch diagnostic: why does tests/test_qwen35_vjp_metal.py fail on main?

name: "qwen35 VJP probe"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install pytest==9.0.3
      - name: Versions
        run: pip list | grep -Ei 'mlx|transformers|torch|numpy'
      - name: Probe fused rotary VJP
        run: |
          python - <<'PY'
          import mlx.core as mx, importlib.metadata as md
          for p in ("mlx","mlx-lm","mlx-vlm"):
              try: print(p, md.version(p))
              except Exception as e: print(p, "missing", e)
          print("device:", mx.default_device())
          import mlx_vlm.models.qwen3_5.language as qlang
          import inspect
          src = inspect.getsource(qlang)
          print("has fused_apply:", "fused_apply" in src)
          import re
          for m in re.finditer(r"^.*fused_apply.*$", src, re.M):
              print("   ", m.group(0).strip()[:120])
          PY
      - name: Run the failing test verbosely
        run: python -m pytest tests/test_qwen35_vjp_metal.py -v -rA
      - name: "tests/test_mlx_batching_and_decay.py (pre-existing check, on MAIN)"
        if: always()
        run: python -m pytest tests/test_mlx_batching_and_decay.py -v -rA
