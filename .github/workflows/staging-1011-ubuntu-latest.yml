name: "staging-1011 ubuntu-latest"
on:
  push:
    branches: ["pr-1011-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: MLX preference on Linux CPU (real mlx, not the shim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[core] "mlx>=0.22.0" mlx-cpu
          # unsloth_zoo/__init__.py refuses to import without unsloth present;
          # --no-deps so it cannot drag transformers past this project's cap.
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
          pip install pytest==9.0.3
      - name: Confirm real mlx, not the simulation shim
        run: |
          python -c "
          import mlx.core as mx
          assert 'mlx_simulation' not in mx.__file__, mx.__file__
          assert mx.array([1,2,3]).sum().item() == 6
          print('real mlx', mx.__version__)
          "
      - name: Preference suites (torch shim)
        run: python -m pytest tests/test_mlx_preference.py tests/test_mlx_trainer_internals.py -q -rs
      - name: RNG rewind against the real runtime
        run: python -m pytest tests/test_mlx_rng_rewind.py -q -rs
