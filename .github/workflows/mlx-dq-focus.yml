# Focused MLX/Mac check for PR #911 on Apple Silicon: runs ONLY the PR's own two
# test files (double-quant reject logic + the Metal-gated e2e). Isolated from the
# pre-existing, unrelated tests/test_mlx_torch_shim_smoke.py failure so the PR's
# own code gets a clean signal on real macos-14 hardware.

name: MLX double-quant focus (PR 911)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mlx-dq:
    name: double-quant reject + metal (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zoo with MLX extras
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install pytest==9.0.3
          pip install bitsandbytes || echo "bitsandbytes unavailable on arm64 (metal e2e will skip, as designed)"

      - name: Show environment
        run: |
          python -c "import platform; print('platform', platform.platform(), platform.machine())"
          python -c "import mlx.core as mx; print('mlx metal available:', mx.metal.is_available())"

      - name: PR reject-logic test (must pass on macOS)
        run: python -m pytest tests/test_mlx_double_quant_reject.py -v

      - name: PR Metal e2e test (runs if bnb present, else skips cleanly)
        run: python -m pytest tests/test_mlx_double_quant_load_metal.py -v -rs
