name: "staging-1011 windows-latest"
on:
  push:
    branches: ["pr-1011-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: Import smoke on Windows (mlx absent, as on every non-Apple host)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      UNSLOTH_COMPILE_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[core]
          pip install pytest==9.0.3
      # This PR only changes unsloth_zoo/mlx/*. The Windows contract is that a
      # non-Apple install still imports and never loads either changed file.
      - name: unsloth_zoo imports and does not pull in the changed modules
        run: |
          python -c "
          import sys, unsloth_zoo
          bad = [m for m in ('unsloth_zoo.mlx.trainer','unsloth_zoo.mlx.preference') if m in sys.modules]
          print('loaded changed modules:', bad or 'NONE')
          assert not bad, bad
          print('unsloth_zoo import OK on Windows without mlx')
          "
