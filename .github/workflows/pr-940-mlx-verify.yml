                  )

              def __len__(self):
                  return 4

              def __getitem__(self, index):
                  flat = self.buffer.reshape(-1)
                  flat[_OFF_STRIDE] = (int(flat[_OFF_STRIDE]) + 7) % 256
                  return {"text": str(index), "images": [self.buffer]}


          _ds = _OffStrideMutation()
          _before = _ds.buffer.copy()
          _ds[0]
          _sampled_blind = (
              _before.reshape(-1)[::_STRIDE][:16].tobytes()
              == _ds.buffer.reshape(-1)[::_STRIDE][:16].tobytes()
          )
          print(
              f"PROBE-AL2 payload={_PIXELS}B stride={_STRIDE} mutated_index={_OFF_STRIDE} "
              f"invisible_to_a_16_sample_probe={_sampled_blind}"
          )
          if not _sampled_blind:
              sys.exit("PROBE-AL2 FAIL: the mutation is not off-stride, the case is not exercised")
          print(
              "PROBE-AL2 fingerprint differs across the mutation:",
              _vlm_media_fingerprint(_before) != _vlm_media_fingerprint(_ds.buffer),
          )
          try:
              build(_OffStrideMutation())
          except ValueError as exc:
              print(f"PROBE-AL2 plan raised ValueError: {str(exc)[:110]!r}")
              assert EXPECTED_FRAGMENT in str(exc), str(exc)
              print(
                  "PROBE-AL2 OK: the whole-payload digest catches a change a sparse sample "
                  "would have missed"
              )
          else:
              sys.exit(
                  "PROBE-AL2 FAIL: an off-stride mutation went unreported -- the content probe "
                  "is still sampling rather than reducing every byte"
              )

          # A sum alone is blind to a change that cancels; the second reduction is not.
          _orig = np.random.RandomState(1).randint(0, 255, (32, 32, 3), dtype=np.uint8)
          _cancel = _orig.copy().reshape(-1)
          _cancel[1] = (int(_cancel[1]) + 3) % 256
          _cancel[2] = (int(_cancel[2]) - 3) % 256
          _cancel = _cancel.reshape(_orig.shape)
          print(
              "PROBE-AL2 cancelling-change detected:",
              _vlm_media_fingerprint(_orig) != _vlm_media_fingerprint(_cancel),
          )
          assert _vlm_media_fingerprint(_orig) != _vlm_media_fingerprint(_cancel), (
              "two reductions are required: a change that cancels under a sum went unseen"
          )


          # ------- PROBE-AL3: the control -- a fresh image per read must work normally -------
          ROOT = tempfile.mkdtemp(prefix="probe940al_")
          N_CONTROL = 8
          CONTROL_PATHS = []
          for _i in range(N_CONTROL):
              _p = os.path.join(ROOT, f"ctrl{_i}.png")
              Image.fromarray(np.full((8, 8, 3), _i + 1, dtype=np.uint8)).save(_p)
              CONTROL_PATHS.append(_p)


          class _FreshImagePerRead:
              """The correct dataset idiom: a new decode per read, nothing shared."""

              def __len__(self):
                  return N_CONTROL

              def __getitem__(self, index):
                  return {"text": str(index % 7), "images": [Image.open(CONTROL_PATHS[index])]}


          control_plan = _create_vlm_batch_plan(
              dataset=_FreshImagePerRead(),
              processor=_ContentProcessor(),
              config=CONFIG,
              batch_size=2,
              max_seq_length=8,
              dataset_order="sequential",
          )
          print(f"PROBE-AL3 control plan built: batches={len(control_plan)}")
          assert len(control_plan) == N_CONTROL // 2, len(control_plan)

          seen = []
          for _b in range(len(control_plan)):
              batch = control_plan[_b]
              assert batch["input_ids"].shape[0] == 2, batch["input_ids"].shape
              seen.append(tuple(batch["input_ids"].shape))
          print(f"PROBE-AL3 materialized every batch: shapes={seen}")

          # Each stored row must still carry ITS OWN pixels, not the last row's.
          from unsloth_zoo.mlx.utils import _restore_vlm_row_image_handles  # noqa: E402

          pixels = [
              int(
                  np.asarray(
                      _restore_vlm_row_image_handles(control_plan._rows[i].item)["images"][0]
                  ).reshape(-1)[0]
              )
              for i in range(N_CONTROL)
          ]
          print(f"PROBE-AL3 per-row first pixel={pixels} expected={[i + 1 for i in range(N_CONTROL)]}")
          assert pixels == [i + 1 for i in range(N_CONTROL)], pixels
          print(
              "PROBE-AL3 OK: a well-behaved dataset builds, materializes every batch and keeps "
              "each row's own pixels -- no false positive from the content probe"
          )


          # ------- PROBE-AL4: the probe must REFERENCE, never copy, what it does not own -------
          _owned = np.full((4, 4, 3), 5, dtype=np.uint8)


          class _StablePayload:
              """Hands back the same object every read WITHOUT mutating it -- legal."""

              def __len__(self):
                  return 4

              def __getitem__(self, index):
                  return {"text": str(index), "images": [_owned]}


          stable_plan = build(_StablePayload())
          stored = stable_plan._rows[0].item["images"][0]
          print(
              f"PROBE-AL4 stored payload is the caller's object: {stored is _owned} "
              f"(id match, no defensive copy)"
          )
          assert stored is _owned, "the plan copied a payload it was only supposed to reference"
          print("PROBE-AL4 OK: an unchanged shared payload is referenced, not copied or rejected")

          print("PROBE-AL ALL OK")
          PY

      - name: "Remaining tests/test_mlx*.py sweep (known red on upstream main, excluded from the pass/fail verdict)"
        if: always()
        continue-on-error: true
        run: |
          strict="tests/test_mlx_batching_and_decay.py tests/test_mlx_shape_guard.py tests/test_mlx_vlm_label_masks.py tests/test_mlx_trainer_internals.py tests/test_mlx_training_e2e_metal.py tests/test_mlx_ddp_metal.py tests/test_mlx_cpt_partition_metal.py"
          rc=0
          for f in tests/test_mlx*.py; do
            case " $strict " in *" $f "*) echo "SWEEP-SKIP $f (covered by a strict step)"; continue ;; esac
            echo "::group::$f"
            python -m pytest "$f" -q -rs \
              --deselect tests/test_mlx_batching_and_decay.py::test_compiler_review_guards_are_present \
              || { echo "SWEEP-RED $f"; rc=1; }
            echo "::endgroup::"
          done
          echo "SWEEP-EXIT $rc (informational only; the strict steps above are the verdict)"
