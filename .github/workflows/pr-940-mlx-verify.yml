          A/B validated on Linux CPU before staging against the pre-fix bodies (see REPORT_940.md).
          """
          import os
          import sys
          import tempfile

          import numpy as np
          import torch  # imported before the plan build: the fingerprint dispatches on sys.modules
          from PIL import Image

