name: "staging-mainbase windows-latest"
on:
  push:
    branches: ["main-baseline-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_ALLOW_CPU: '1'
      UNSLOTH_COMPILE_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4.0,<2.11.0"
          pip install -e .[core]
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || echo "unsloth unavailable; the darwin+arm64 path does not need it"
          pip install pytest==9.0.3
      - name: Report the runtime under test
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          python -c "import mlx.core as mx, sys; o=str(getattr(mx,'__file__','')); sys.exit('shim, not real mlx: '+o) if 'mlx_simulation' in o else print('real mlx at', o, '| sum', int(mx.array([1,2,3]).sum()))" || echo "no mlx on this runner"
      - name: "tests/test_mlx_get_peft_model_seed_ordering.py"
        id: mlx_get_peft_model_seed_ordering
        if: always()
        run: |
          rc=0
          python -m pytest tests/test_mlx_get_peft_model_seed_ordering.py -q --tb=short -p no:cacheprovider > out_mlx_get_peft_model_seed_ordering.txt 2>&1 || rc=$?
          cat out_mlx_get_peft_model_seed_ordering.txt
          grep -oE '[0-9]+ passed' out_mlx_get_peft_model_seed_ordering.txt | tail -1 | grep -oE '^[0-9]+' > passed_mlx_get_peft_model_seed_ordering.txt || echo 0 > passed_mlx_get_peft_model_seed_ordering.txt
          echo "$rc" > rc_mlx_get_peft_model_seed_ordering.txt
          grep -E '^FAILED ' out_mlx_get_peft_model_seed_ordering.txt >> failed_all.txt || true
      - name: "tests/test_mlx_lora_group_selection.py"
        id: mlx_lora_group_selection
        if: always()
        run: |
          rc=0
          python -m pytest tests/test_mlx_lora_group_selection.py -q --tb=short -p no:cacheprovider > out_mlx_lora_group_selection.txt 2>&1 || rc=$?
          cat out_mlx_lora_group_selection.txt
          grep -oE '[0-9]+ passed' out_mlx_lora_group_selection.txt | tail -1 | grep -oE '^[0-9]+' > passed_mlx_lora_group_selection.txt || echo 0 > passed_mlx_lora_group_selection.txt
          echo "$rc" > rc_mlx_lora_group_selection.txt
          grep -E '^FAILED ' out_mlx_lora_group_selection.txt >> failed_all.txt || true
      - name: "tests/test_mlx_save_export_regressions.py"
        id: mlx_save_export_regressions
        if: always()
        run: |
          rc=0
          python -m pytest tests/test_mlx_save_export_regressions.py -q --tb=short -p no:cacheprovider > out_mlx_save_export_regressions.txt 2>&1 || rc=$?
          cat out_mlx_save_export_regressions.txt
          grep -oE '[0-9]+ passed' out_mlx_save_export_regressions.txt | tail -1 | grep -oE '^[0-9]+' > passed_mlx_save_export_regressions.txt || echo 0 > passed_mlx_save_export_regressions.txt
          echo "$rc" > rc_mlx_save_export_regressions.txt
          grep -E '^FAILED ' out_mlx_save_export_regressions.txt >> failed_all.txt || true
      - name: "tests/test_mlx_training_e2e_metal.py"
        id: mlx_training_e2e_metal
        if: always()
        run: |
          rc=0
          python -m pytest tests/test_mlx_training_e2e_metal.py -q --tb=short -p no:cacheprovider > out_mlx_training_e2e_metal.txt 2>&1 || rc=$?
          cat out_mlx_training_e2e_metal.txt
          grep -oE '[0-9]+ passed' out_mlx_training_e2e_metal.txt | tail -1 | grep -oE '^[0-9]+' > passed_mlx_training_e2e_metal.txt || echo 0 > passed_mlx_training_e2e_metal.txt
          echo "$rc" > rc_mlx_training_e2e_metal.txt
          grep -E '^FAILED ' out_mlx_training_e2e_metal.txt >> failed_all.txt || true
      - name: Verdict
        if: always()
        run: |
          total=0
          for f in passed_*.txt; do [ -f "$f" ] && total=$((total + $(cat "$f"))); done
          echo "executed(passed)=$total floor=100"
          echo "----- failures across all files -----"
          cat failed_all.txt 2>/dev/null || echo "(none)"
          bad=0
          for f in rc_*.txt; do [ -f "$f" ] && [ "$(cat "$f")" != "0" ] && bad=1; done
          [ "$total" -ge "100" ] || { echo "::error::only $total passed, expected >= 100 - this lane proved nothing"; exit 1; }
          exit "$bad"
