name: "staging-962 macos-14 (real MLX / Metal)"
on:
  push:
    branches: ["pr-962-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  mlx-metal:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install real MLX + zoo
        # torch is force-installed because pyproject gates it off on darwin+arm64
        # while tests/mlx_simulation/__init__.py imports it unconditionally.
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
          pip install pytest==9.0.3 datasets
          python -c "import mlx.core as mx; print('device', mx.default_device()); print('metal', mx.metal.is_available())"

      - name: Routing tests (must execute, not skip)
        run: python -m pytest tests/test_mlx_quantized_optimizer_routing.py -v -rs

      - name: PR numeric state tests on Metal (the job the PR says exists)
        # This file is currently in NO CI job anywhere: mlx-ci.yml has a hand
        # maintained allowlist of six files and this is not one of them.
        run: python -m pytest tests/test_mlx_quantized_optimizer_state.py -v -rs

      - name: Assert the numeric tests did not silently skip
        run: |
          python -m pytest tests/test_mlx_quantized_optimizer_state.py -q -rs 2>&1 | tee out.txt
          if grep -qiE '[0-9]+ skipped' out.txt; then
            echo "numeric state tests skipped on a real-MLX runner"; exit 1
          fi

      - name: Metal probes (zero-gradient invariant, dead zone, state bytes, peak memory)
        # Expected to fail: it documents the defects. Do not gate the e2e on it.
        continue-on-error: true
        run: python ci_probes/pr962_metal_probe.py

      - name: End-to-end LoRA training, adamw vs adamw_8bit
        run: python ci_probes/pr962_metal_e2e.py --steps 200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr962-metal-e2e
          path: pr962_e2e_results.json
          if-no-files-found: ignore
