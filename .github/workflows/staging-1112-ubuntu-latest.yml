name: "staging-1112 ubuntu-latest"
on:
  push:
    branches: ["pr-1112-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest pytest-asyncio pytest-timeout
      - run: python -m pip install 'torch>=2.4.0,<2.13.0'
      - run: rc=0; python -m pytest tests/security/test_disable_gpu_init_device_constants.py -q -rs --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then tot=$(awk '/^ERROR /{n++} END{print n+0}' pytest_out.txt); dep=$(awk '/^E +ModuleNotFoundError. No module named .(torch|unsloth_zoo|transformers).$/{n++} END{print n+0}' pytest_out.txt); if [ "$dep" -gt 0 ] && [ "$tot" -le "$dep" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(awk '/^FAILED /{n++} END{print n+0}' pytest_out.txt); dep=$(awk '/^FAILED .* No module named .(torch|unsloth_zoo|transformers).$/{n++} END{print n+0}' pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
