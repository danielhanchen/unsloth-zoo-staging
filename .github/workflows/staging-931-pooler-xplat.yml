name: staging-931 pooler xplat
on:
  push:
    branches: [pr-931-xplat-ci]
jobs:
  pooler-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU) + zoo test deps
        shell: bash
        # Latest torch on triton-less mac builds crashes at import in
        # flop_counter (_JITFunction is None); pin a known-good version there.
        run: |
          if [ "${{ matrix.os }}" = "macos-14" ]; then TORCH_SPEC="torch==2.8.0"; else TORCH_SPEC="torch"; fi
          python -m pip install "$TORCH_SPEC" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[core] pytest "transformers==5.5.0"
          python -m pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main"
      - name: Run gemma4 vision pooler tests
        env:
          PYTHONPATH: .
          UNSLOTH_IS_PRESENT: "1"
        run: python -m pytest tests/test_gemma4_vision_pooler_fp16.py -q -p no:cacheprovider
