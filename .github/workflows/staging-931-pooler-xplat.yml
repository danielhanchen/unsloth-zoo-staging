name: staging-931 pooler xplat
on:
  push:
    branches: [pr-931-xplat-ci]
jobs:
  pooler-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU) + zoo test deps
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install pytest "transformers==5.5.0" "protobuf<4"
      - name: Run gemma4 vision pooler tests
        env:
          PYTHONPATH: .
          UNSLOTH_IS_PRESENT: "1"
        run: python -m pytest tests/test_gemma4_vision_pooler_fp16.py -q -p no:cacheprovider
