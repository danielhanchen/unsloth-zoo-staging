name: "macfix-1024 MLX suites, one process per file"
on:
  push:
    branches: ["pr-1024-macfix-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    env:
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      HF_HOME: ${{ github.workspace }}/.hfcache
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner resources
        run: |
          uname -a
          df -h . | tail -2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pytest-timeout
          # mlx-vlm 0.6.10 requires transformers>=5.14 while unsloth-zoo pins <=5.5.0,
          # so the MLX stack has to go in with --no-deps-style force. Recorded on purpose:
          # this conflict is itself a review finding for PR #1024.
          pip install "torch>=2.4,<2.11" torchvision "mlx>=0.22.0" "mlx-lm>=0.31.2" pillow
          pip install --upgrade "mlx-vlm==0.6.10" "transformers>=5.14"
          # zoo's __init__ requires `unsloth` importable on non-MLX hosts.
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
      - name: Versions
        run: |
          python -c "import mlx.core as mx; print('mlx', mx.default_device(), mx.__file__)"
          python -c "import mlx_vlm, transformers, torch; print('mlx-vlm', mlx_vlm.__version__, 'tf', transformers.__version__, 'torch', torch.__version__)"
      # One pytest process per file: tests/mlx_simulation/ replaces sys.modules["mlx.core"]
      # process-wide, so a shared process poisons whatever runs after it. This mirrors
      # unsloth-zoo's own consolidated-tests-ci.yml.
      - name: tests/test_mlx_vlm_label_masks.py
        run: python -m pytest tests/test_mlx_vlm_label_masks.py -q -rf --timeout=1200
      - name: tests/test_mlx_save_export_regressions.py
        if: always()
        run: python -m pytest tests/test_mlx_save_export_regressions.py -q -rf --timeout=1200
      - name: tests/test_mlx_shape_guard.py
        if: always()
        run: python -m pytest tests/test_mlx_shape_guard.py -q -rf --timeout=1200
      - name: Real small-model MLX smoke
        if: always()
        run: python scripts/mac_mlx_smoke.py 2>&1 | tee smoke-${{ matrix.os }}.log
      - name: Disk after
        if: always()
        run: df -h . | tail -2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macfix-1024-${{ matrix.os }}
          path: smoke-*.log
